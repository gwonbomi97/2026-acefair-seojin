<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>홍보영상 시청 인증</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF9EC;
    --cream-2:#FFF3D6;
    --ink:#27304F;
    --ink-soft:#6B7390;
    --pink:#FF7A9C;
    --pink-dark:#F0577F;
    --orange:#FFA24C;
    --yellow:#FFD84D;
    --yellow-soft:#FFEFA8;
    --mint:#7FE0C4;
    --mint-dark:#3FB68A;
    --sky:#8FD3FF;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 8% 0%, rgba(255,216,77,0.35), transparent 42%),
      radial-gradient(circle at 100% 22%, rgba(255,122,156,0.22), transparent 38%),
      radial-gradient(circle at 0% 62%, rgba(143,211,255,0.28), transparent 36%),
      radial-gradient(circle at 100% 90%, rgba(127,224,196,0.28), transparent 40%),
      var(--cream);
    font-family:'Noto Sans KR', sans-serif;
    color:var(--ink);
    display:flex;justify-content:center;
    padding:26px 16px 0;
    position:relative;overflow-x:hidden;
  }
  .stage{width:100%;max-width:460px;position:relative;z-index:1;padding-bottom:140px;}

  /* ---- 장식: 컨페티 / 반짝이 ---- */
  .deco{position:absolute;pointer-events:none;z-index:0;}
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .confetti i{position:absolute;display:block;border-radius:3px;opacity:.85;}
  .sparkle{position:absolute;width:22px;height:22px;pointer-events:none;}
  .sparkle svg{width:100%;height:100%;}

  /* ---- 배지 ---- */
  .badge{
    display:inline-flex;align-items:center;gap:7px;
    background:var(--yellow);color:#4A3A00;
    font-size:14px;font-weight:700;padding:8px 16px;border-radius:999px;
    box-shadow:0 4px 12px rgba(255,180,50,0.35);
  }
  .badge svg{width:15px;height:15px;flex-shrink:0;}

  /* ---- 헤드라인 ---- */
  .hero{position:relative;padding-right:96px;}
  h1{
    font-weight:900;font-size:clamp(23px, 7vw, 29px);line-height:1.35;margin:16px 0 12px;letter-spacing:-0.03em;color:var(--ink);word-break:keep-all;
  }
  h1 .pink{color:var(--pink-dark);}
  h1 .orange{color:#F28A18;}
  .gift{position:absolute;right:-8px;top:34px;width:112px;height:112px;}
  .gift svg{width:100%;height:100%;filter:drop-shadow(0 8px 14px rgba(240,87,127,0.28));}
  .sub{font-size:14.5px;line-height:1.75;color:#4B536F;margin:0 0 20px;}

  /* ---- 비디오 카드 ---- */
  .video-card{
    background:var(--card);border-radius:22px;padding:14px;
    box-shadow:0 12px 34px rgba(255,150,120,0.18), 0 2px 6px rgba(39,48,79,0.06);
  }
  .video-frame{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#F2EEE3;}
  .video-frame #player{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;}
  .progress-row{display:flex;align-items:center;gap:12px;margin-top:14px;}
  .progress-track{flex:1;height:10px;border-radius:999px;background:#F1ECDF;overflow:hidden;}
  .progress-fill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg, var(--pink), var(--orange), var(--yellow));transition:width .35s ease;}
  .progress-pct{font-size:15px;font-weight:800;color:var(--pink-dark);min-width:40px;text-align:right;font-variant-numeric:tabular-nums;}
  .status-line{margin-top:10px;font-size:13px;color:var(--ink-soft);}
  .unmute-btn{
    margin-top:12px;width:100%;border:2px solid var(--ink);background:#fff;color:var(--ink);
    border-radius:12px;padding:12px;font-family:'Noto Sans KR',sans-serif;font-size:15px;font-weight:700;cursor:pointer;
  }
  .unmute-btn.hidden{display:none;}

  /* ---- CTA ---- */
  .cta{
    width:100%;margin-top:20px;border:none;border-radius:999px;padding:18px 20px;
    font-family:'Noto Sans KR', sans-serif;font-size:17px;font-weight:800;cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, background .2s ease;
  }
  .cta[disabled]{
    background:linear-gradient(135deg, #FF8FAE, #FF7A9C 60%, #FFA24C);color:#fff;cursor:not-allowed;
    box-shadow:0 10px 22px rgba(255,122,156,0.35);opacity:.95;
  }
  .cta.ready{
    background:linear-gradient(135deg, var(--yellow), var(--orange) 55%, var(--pink));color:#3A2400;
    box-shadow:0 14px 28px rgba(255,162,76,0.4);
  }
  .cta.ready:active{transform:scale(0.98);}

  /* ---- 완료 화면 ---- */
  .done-wrap{
    display:none;background:var(--card);border-radius:22px;padding:34px 26px 30px;text-align:center;
    box-shadow:0 12px 34px rgba(255,150,120,0.18);color:var(--ink);
  }
  .done-wrap.show{display:block;}
  .stage.done .video-card,.stage.done .cta{display:none;}
  .check-circle{
    width:68px;height:68px;margin:0 auto 16px;border-radius:50%;
    background:linear-gradient(135deg, var(--mint), var(--mint-dark));
    display:flex;align-items:center;justify-content:center;box-shadow:0 10px 20px rgba(63,182,138,0.35);
  }
  .check-circle svg{width:32px;height:32px;}
  .done-wrap h2{font-size:24px;font-weight:900;margin:0 0 6px;}
  .done-wrap p{font-size:14px;color:var(--ink-soft);margin:0 0 22px;line-height:1.6;}
  .code-box{background:linear-gradient(135deg, #FFF0B8, #FFD9E4);border-radius:16px;padding:20px;margin-bottom:22px;}
  .code-label{font-size:12.5px;color:#8A6A00;font-weight:700;margin-bottom:6px;}
  .code-value{font-size:38px;font-weight:900;letter-spacing:0.14em;color:var(--ink);font-variant-numeric:tabular-nums;}
  .record-status{font-size:12px;margin:-10px 0 16px;color:var(--ink-soft);}
  .record-status.ok{color:var(--mint-dark);}
  .record-status.fail{color:#D9542B;}
  .reset-link{background:none;border:none;color:var(--ink-soft);font-size:12.5px;text-decoration:underline;cursor:pointer;padding:6px;}

  /* ---- 하단 꽃밭 ---- */
  .meadow{position:fixed;left:0;right:0;bottom:0;height:120px;pointer-events:none;z-index:0;}
  .meadow svg{width:100%;height:100%;display:block;}

  /* ---- 외부 브라우저 안내 ---- */
  .ext-overlay{position:fixed;inset:0;z-index:99;background:rgba(39,48,79,0.86);display:none;align-items:center;justify-content:center;padding:24px;}
  .ext-overlay.show{display:flex;}
  .ext-box{background:#fff;color:var(--ink);border-radius:20px;padding:26px 22px;max-width:360px;width:100%;text-align:center;}
  .ext-box h3{font-size:20px;font-weight:900;margin:0 0 10px;}
  .ext-box p{font-size:14px;line-height:1.6;color:var(--ink-soft);margin:0 0 16px;}
  .ext-box .steps{text-align:left;font-size:13.5px;line-height:1.7;background:var(--cream-2);border-radius:12px;padding:12px 14px;margin-bottom:14px;}
  .ext-btn{display:block;width:100%;border:none;border-radius:12px;padding:14px;font-family:'Noto Sans KR',sans-serif;font-size:15px;font-weight:800;
    background:linear-gradient(135deg, var(--yellow), var(--orange));color:#3A2400;cursor:pointer;text-decoration:none;}
  .ext-skip{background:none;border:none;color:var(--ink-soft);font-size:12.5px;text-decoration:underline;margin-top:10px;cursor:pointer;}
  @media (prefers-reduced-motion: reduce){.progress-fill,.cta{transition:none;}}
</style>
</head>
<body>

<div class="ext-overlay" id="extOverlay">
  <div class="ext-box">
    <h3>브라우저에서 열어 주세요</h3>
    <p>앱 안에서는 영상 재생이 원활하지 않을 수 있어요.<br>Chrome이나 Safari에서 열면 정상적으로 시청돼요.</p>
    <div class="steps" id="extSteps"></div>
    <a class="ext-btn" id="extOpenBtn" href="#">브라우저로 열기</a>

</div>

<div class="confetti" aria-hidden="true">

<div class="meadow" aria-hidden="true">
  <svg viewBox="0 0 460 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0 78 C60 60 110 96 180 82 S300 58 370 80 S440 70 460 74 L460 120 L0 120 Z" fill="#DDF3D0"/>
    <path d="M0 96 C80 82 140 110 230 96 S360 78 460 96 L460 120 L0 120 Z" fill="#C7EAB6"/>
    <g id="f1"><line x1="42" y1="110" x2="42" y2="82" stroke="#7DBF6A" stroke-width="3"/>
      <circle cx="42" cy="72" r="6" fill="#FFF1A8"/><circle cx="34" cy="70" r="5" fill="#FFF7D6"/><circle cx="50" cy="70" r="5" fill="#FFF7D6"/><circle cx="38" cy="78" r="5" fill="#FFF7D6"/><circle cx="46" cy="78" r="5" fill="#FFF7D6"/><circle cx="42" cy="72" r="3" fill="#FFB84D"/></g>

      <circle cx="34" cy="74" r="5" fill="#FFB3C7"/><circle cx="50" cy="74" r="5" fill="#FFB3C7"/><circle cx="38" cy="82" r="5" fill="#FFB3C7"/><circle cx="46" cy="82" r="5" fill="#FFB3C7"/><circle cx="42" cy="70" r="5" fill="#FFB3C7"/><circle cx="42" cy="76" r="3" fill="#FFF1A8"/></g>
    <g transform="translate(340,-4)"><line x1="42" y1="110" x2="42" y2="82" stroke="#7DBF6A" stroke-width="3"/>
      <circle cx="34" cy="70" r="5" fill="#FFF7D6"/><circle cx="50" cy="70" r="5" fill="#FFF7D6"/><circle cx="38" cy="78" r="5" fill="#FFF7D6"/><circle cx="46" cy="78" r="5" fill="#FFF7D6"/><circle cx="42" cy="66" r="5" fill="#FFF7D6"/><circle cx="42" cy="72" r="3" fill="#FFB84D"/></g>
    <g transform="translate(380,10) scale(.85)"><line x1="42" y1="110" x2="42" y2="86" stroke="#7DBF6A" stroke-width="3"/>
      <circle cx="34" cy="74" r="5" fill="#FFB3C7"/><circle cx="50" cy="74" r="5" fill="#FFB3C7"/><circle cx="38" cy="82" r="5" fill="#FFB3C7"/><circle cx="46" cy="82" r="5" fill="#FFB3C7"/><circle cx="42" cy="70" r="5" fill="#FFB3C7"/><circle cx="42" cy="76" r="3" fill="#FFF1A8"/></g>
    <g transform="translate(200,14) scale(.7)"><line x1="42" y1="110" x2="42" y2="86" stroke="#7DBF6A" stroke-width="3"/>
      <circle cx="34" cy="74" r="5" fill="#FFF1A8"/><circle cx="50" cy="74" r="5" fill="#FFF1A8"/><circle cx="38" cy="82" r="5" fill="#FFF1A8"/><circle cx="46" cy="82" r="5" fill="#FFF1A8"/><circle cx="42" cy="70" r="5" fill="#FFF1A8"/><circle cx="42" cy="76" r="3" fill="#FF8AA8"/></g>
  </svg>
</div>

<div class="stage" id="stage">

  <span class="badge">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
    서진여고의 매력
  </span>

  <div class="hero">
    <h1>영상을 끝까지 보면<br><span class="pink">학생 작품을</span><br><span class="orange">선물</span> 받을 수 있어요!</h1>
    <div class="gift" aria-hidden="true">
      <svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
        <rect x="24" y="62" width="92" height="66" rx="10" fill="#FF8FAE"/>
        <rect x="24" y="62" width="92" height="14" fill="#F0577F" opacity=".35"/>
        <rect x="16" y="46" width="108" height="26" rx="8" fill="#FFA6BE"/>
        <rect x="62" y="46" width="16" height="82" fill="#FFD84D"/>
        <rect x="62" y="46" width="16" height="26" fill="#FFC81E"/>
        <path d="M70 46 C50 46 40 30 48 22 C56 14 68 26 70 44 Z" fill="#FFD84D"/>
        <path d="M70 46 C90 46 100 30 92 22 C84 14 72 26 70 44 Z" fill="#FFD84D"/>
        <path d="M70 46 C58 40 54 30 58 26 C62 22 68 34 70 44 Z" fill="#FFC81E"/>
        <path d="M70 46 C82 40 86 30 82 26 C78 22 72 34 70 44 Z" fill="#FFC81E"/>
        <circle cx="70" cy="46" r="7" fill="#FFB84D"/>
        <path d="M118 30 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill="#FFD84D"/>
        <path d="M14 96 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" fill="#8FD3FF"/>
        <path d="M118 108 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" fill="#7FE0C4"/>
      </svg>
    </div>
  </div>

  <p class="sub">아래 영상을 3분 이상 시청해 주세요.<br>다 보고 나면 인증 코드가 나와요.<br>그 화면을 스태프에게 보여주시면 선물을 드려요!</p>

  <div class="video-card">
    <div class="video-frame">
      <iframe id="player" title="학교 홍보 영상" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen playsinline></iframe>
    </div>
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-pct" id="progressPct">0%</div>
    </div>
    <div class="status-line" id="statusLine">영상이 자동으로 재생돼요</div>
    <button class="unmute-btn" id="unmuteBtn">🔊 소리 켜기</button>
  </div>

  <button class="cta" id="ctaBtn" disabled>🎁 영상을 3분 이상 봐야 열려요!</button>

  <div class="done-wrap" id="doneWrap">
    <div class="check-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <h2>시청 완료!</h2>
    <p>이 화면을 부스 스태프에게 보여주세요.<br>확인 후 선물을 드립니다.</p>
    <div class="code-box">
      <div class="code-label">인증 코드</div>
      <div class="code-value" id="codeValue">0000</div>
    </div>
    <div class="record-status" id="recordStatus"></div>
    <button class="reset-link" id="resetBtn">다음 사람 차례라면 여기를 눌러 초기화</button>

<script>
  /* ---- 인앱 브라우저(카카오톡·라인·인스타 등)에서 열리면 외부 브라우저로 넘기기 ---- */
  (function(){
    var ua = navigator.userAgent || '';
    var url = window.location.href;
    var isIOS = /iPhone|iPad|iPod/i.test(ua);
    var isAndroid = /Android/i.test(ua);

    if(/KAKAOTALK/i.test(ua)){
      window.location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url);
      return;
    }
    if(/Line\//i.test(ua)){
      if(url.indexOf('openExternalBrowser=1') < 0){
        window.location.href = url + (url.indexOf('?') > -1 ? '&' : '?') + 'openExternalBrowser=1';
      }
      return;
    }
    var otherInApp = /Instagram|FBAN|FBAV|FB_IAB|NAVER\(inapp|DaumApps|everytimeApp|TelegramBot|Snapchat/i.test(ua)
                  || (isIOS && !/Safari/i.test(ua))
                  || (isAndroid && /; wv\)/i.test(ua));
    if(!otherInApp) return;

    var overlay = document.getElementById('extOverlay');
    var btn = document.getElementById('extOpenBtn');
    var steps = document.getElementById('extSteps');
    if(isAndroid){
      btn.href = 'intent://' + url.replace(/^https?:\/\//,'') + '#Intent;scheme=https;package=com.android.chrome;end';
      steps.innerHTML = '버튼이 안 되면: 화면 오른쪽 위 <b>⋮</b> 또는 <b>공유</b> → <b>다른 브라우저로 열기</b>';
    }else{
      btn.style.display = 'none';
      steps.innerHTML = '화면 오른쪽 위(또는 아래) <b>⋯</b> / <b>공유</b> 아이콘 → <b>Safari로 열기</b>';
    }
    overlay.classList.add('show');
    document.getElementById('extSkip').addEventListener('click', function(){
      overlay.classList.remove('show');
    });
  })();

  var VIDEO_ID = 'Yg1IUxx3leE';
  var REQUIRED_SECONDS = 180;
  var API_URL = 'https://script.google.com/macros/s/AKfycbymEagi7F7gsYsqr2xY8GrZ9YBj8UcOBPRh3os6I1XW4VNF5eSnCRlD6jyiwPIb3_TvVg/exec';

  var duration = 0;
  var watchedBuckets = new Set();
  var unlocked = false;
  var lastState = -1;
  var playerReady = false;

  // 실제 재생 위치 추적
  var lastCurrentTime = null;
  var SEEK_TOLERANCE = 1.8;
  var MAX_NORMAL_DELTA = 2.8;

  var fillEl = document.getElementById('progressFill');
  var pctEl = document.getElementById('progressPct');
  var statusEl = document.getElementById('statusLine');
  var ctaBtn = document.getElementById('ctaBtn');
  var stageEl = document.getElementById('stage');
  var doneWrap = document.getElementById('doneWrap');
  var codeValue = document.getElementById('codeValue');
  var resetBtn = document.getElementById('resetBtn');
  var playerFrame = document.getElementById('player');
  var recordStatus = document.getElementById('recordStatus');
  var unmuteBtn = document.getElementById('unmuteBtn');

  function buildEmbedUrl(){
    var params = [
      'enablejsapi=1',
      'autoplay=1',
      'mute=1',
      'rel=0',
      'modestbranding=1',
      'playsinline=1',
      'controls=1',
      'fs=1'
    ];
    if(/^https?:/.test(window.location.origin)){
      params.push('origin=' + encodeURIComponent(window.location.origin));
    }
    return 'https://www.youtube-nocookie.com/embed/' + VIDEO_ID + '?' + params.join('&');
  }

  function sendToPlayer(msg){
    if(!playerFrame || !playerFrame.contentWindow) return;
    try{
      playerFrame.contentWindow.postMessage(JSON.stringify(msg), '*');
    }catch(e){}
  }

  function subscribe(){
    sendToPlayer({
      event:'listening',
      id:'player',
      channel:'widget'
    });
    sendToPlayer({
      event:'command',
      func:'addEventListener',
      args:['onStateChange'],
      id:'player',
      channel:'widget'
    });
  }

  playerFrame.addEventListener('load', function(){
    subscribe();
    setTimeout(subscribe, 800);
  });

  playerFrame.src = buildEmbedUrl();

  function clearUnlocked(){
    unlocked = false;
    ctaBtn.disabled = true;
    ctaBtn.classList.remove('ready');
    ctaBtn.textContent = '🎁 영상을 3분 이상 봐야 열려요!';
  }

  function invalidateFrom(sec){
    var cutoff = Math.max(0, Math.floor(sec));
    var next = new Set();

    watchedBuckets.forEach(function(bucket){
      if(bucket < cutoff) next.add(bucket);
    });

    watchedBuckets = next;
    clearUnlocked();
    updateProgress();
  }

  function addWatchedRange(from, to){
    var start = Math.max(0, Math.floor(from));
    var end = Math.max(start, Math.floor(to));

    for(var i = start; i < end; i++){
      watchedBuckets.add(i);
    }
  }

  function handleCurrentTime(currentTime){
    if(typeof currentTime !== 'number' || !isFinite(currentTime) || lastState !== 1 || !duration){
      return;
    }

    currentTime = Math.max(0, Math.min(currentTime, duration));

    if(lastCurrentTime === null){
      lastCurrentTime = currentTime;
      updateProgress();
      return;
    }

    var delta = currentTime - lastCurrentTime;

    // 정상 재생: 약간의 샘플링 오차만 허용
    if(delta >= -SEEK_TOLERANCE && delta <= MAX_NORMAL_DELTA){
      if(delta > 0){
        addWatchedRange(lastCurrentTime, currentTime);
      }
    }
    // 앞으로 크게 이동: 건너뛴 구간은 인정하지 않음
    else if(delta > MAX_NORMAL_DELTA){
      invalidateFrom(currentTime);
      statusEl.textContent = '건너뛴 구간이 있어요 · 이동한 위치부터 다시 시청해 주세요';
    }
    // 뒤로 크게 이동: 이동 위치 이후 기존 기록을 무효화
    else if(delta < -SEEK_TOLERANCE){
      invalidateFrom(currentTime);
      statusEl.textContent = '재생 위치가 뒤로 이동했어요 · 이 구간부터 다시 시청해 주세요';
    }

    lastCurrentTime = currentTime;
    updateProgress();
  }

  window.addEventListener('message', function(e){
    if(e.source !== playerFrame.contentWindow) return;

    var data = e.data;
    if(typeof data === 'string'){
      try{
        data = JSON.parse(data);
      }catch(err){
        return;
      }
    }
    if(!data || typeof data !== 'object') return;

    if(data.event === 'onReady'){
      playerReady = true;
      statusEl.textContent = '영상이 자동으로 재생돼요 · 소리는 아래 버튼으로 켤 수 있어요';
    }
    else if(data.event === 'onStateChange'){
      handleState(data.info);
    }
    else if(data.event === 'infoDelivery' && data.info){
      var info = data.info;

      if(typeof info.duration === 'number' && info.duration > 0){
        duration = info.duration;
      }

      if(typeof info.playerState === 'number'){
        handleState(info.playerState);
      }

      if(info.muted === false){
        unmuteBtn.classList.add('hidden');
      }

      if(typeof info.currentTime === 'number'){
        handleCurrentTime(info.currentTime);
      }
    }
  });

  function handleState(state){
    if(typeof state !== 'number') return;

    if(state === lastState){
      return;
    }

    lastState = state;

    if(state === 1){
      // 재생 재개 후 현재 위치부터 새롭게 추적
      lastCurrentTime = null;
      statusEl.textContent = '시청 기록 중이에요';
      updateProgress();
    }
    else if(state === 2){
      lastCurrentTime = null;
      statusEl.textContent = '일시정지됨 · 다시 재생하면 이어서 기록돼요';
    }
    else if(state === 0){
      // 영상 종료만으로 전체 시청을 인정하지 않는다.
      lastCurrentTime = null;
      updateProgress();

      if(unlocked){
        statusEl.textContent = '3분 시청 완료! 아래 버튼을 눌러주세요';
      }else{
        statusEl.textContent = '영상이 끝났어요 · 실제 시청 구간을 확인하고 있어요';
      }
    }
  }

  // 재생 중 정보 전달이 끊길 경우를 대비해 1초마다 상태 요청
  setInterval(function(){
    if(!playerReady) return;

    sendToPlayer({
      event:'command',
      func:'getDuration',
      args:[],
      id:'player',
      channel:'widget'
    });

    sendToPlayer({
      event:'command',
      func:'getCurrentTime',
      args:[],
      id:'player',
      channel:'widget'
    });

    sendToPlayer({
      event:'command',
      func:'getPlayerState',
      args:[],
      id:'player',
      channel:'widget'
    });
  }, 1000);

  function requiredSeconds(){
    return duration ? Math.min(REQUIRED_SECONDS, Math.ceil(duration)) : REQUIRED_SECONDS;
  }

  function updateProgress(){
    var need = requiredSeconds();
    var watched = 0;

    for(var i = 0; i < need; i++){
      if(watchedBuckets.has(i)) watched++;
    }

    var ratio = watched / need;
    var pct = Math.round(ratio * 100);

    fillEl.style.width = pct + '%';
    pctEl.textContent = pct + '%';

    var remain = need - watched;

    if(!unlocked && remain > 0 && lastState === 1){
      statusEl.textContent =
        '시청 기록 중 · ' +
        Math.floor(remain / 60) + '분 ' +
        (remain % 60) + '초 남았어요';
    }

    if(ratio >= 1){
      if(!unlocked){
        unlocked = true;
        ctaBtn.disabled = false;
        ctaBtn.classList.add('ready');
        ctaBtn.textContent = '🎁 선물 받기';
        statusEl.textContent = '3분 시청 완료! 아래 버튼을 눌러주세요';
      }
    }else if(unlocked){
      // 완료 후 재생 위치를 변경하여 기록이 부족해지면 즉시 취소
      clearUnlocked();
      statusEl.textContent = '시청 구간이 변경됐어요 · 부족한 부분을 다시 시청해 주세요';
    }
  }

  unmuteBtn.addEventListener('click', function(){
    sendToPlayer({
      event:'command',
      func:'unMute',
      args:[],
      id:'player',
      channel:'widget'
    });
    sendToPlayer({
      event:'command',
      func:'setVolume',
      args:[100],
      id:'player',
      channel:'widget'
    });
    sendToPlayer({
      event:'command',
      func:'playVideo',
      args:[],
      id:'player',
      channel:'widget'
    });
    unmuteBtn.classList.add('hidden');
  });

  ctaBtn.addEventListener('click', async function(){
    if(!unlocked) return;

    ctaBtn.disabled = true;
    ctaBtn.textContent = '등록 중…';

    var code = String(Math.floor(1000 + Math.random() * 9000));
    codeValue.textContent = code;

    var saved = false;

    if(API_URL){
      try{
        var r = await fetch(
          API_URL + '?action=add&code=' + code + '&_=' + Date.now(),
          { cache: 'no-store' }
        );
        var j = await r.json();
        saved = !!(j && j.ok);
      }catch(e){
        saved = false;
      }
    }

    if(saved){
      recordStatus.textContent = '명단에 자동으로 기록되었어요';
      recordStatus.className = 'record-status ok';
    }else{
      recordStatus.textContent = '명단 저장에는 실패했어요 — 이 코드를 스태프에게 알려주세요';
      recordStatus.className = 'record-status fail';
    }

    stageEl.classList.add('done');
    doneWrap.classList.add('show');
  });

  resetBtn.addEventListener('click', function(){
    location.reload();
  });
</script>

</body>
</html>
